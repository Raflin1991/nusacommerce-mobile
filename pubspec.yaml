name: nusacommerce_mobile
description: "NusaCommerce Mobile POS, Sales & Owner Super-App — Enterprise Multi-Tenant Flutter Application integrated with NusaCommerce Cloud."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^14.2.7
  dio: ^5.7.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  esc_pos_utils_plus: ^2.0.4
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
