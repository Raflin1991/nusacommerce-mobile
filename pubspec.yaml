name: nusacommerce_mobile
description: "OXORA Mobile POS, Sales & Owner Super-App — The AI-Powered Business Operating System integrated with OXORA Cloud."
publish_to: 'none'
version: 2.0.0+200

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^14.2.7
  dio: ^5.7.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  esc_pos_utils_plus: ^2.0.4
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  uuid: ^4.5.0

  # 1. Real Bluetooth Thermal Printer Driver
  print_bluetooth_thermal: ^1.1.1
  permission_handler: ^11.3.1

  # 2. Background Reactive Connectivity Listener
  connectivity_plus: ^6.0.5

  # 3. Enterprise Indexed Local Database Engine
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/oxora_icon.png
    - assets/images/oxora_wordmark_light.png
    - assets/images/oxora_wordmark_dark.png
    - assets/images/oxora_splash_wordmark_light.png
    - assets/images/oxora_splash_wordmark_dark.png
    - assets/images/nusacommerce_icon.png
    - assets/images/buddy/buddy_greeting.webp
    - assets/images/buddy/buddy_idle.webp
    - assets/images/buddy/buddy_working.webp
    - assets/images/buddy/buddy_success.webp
