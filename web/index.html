<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OXO.ID — THE AI-POWERED BUSINESS OPERATING SYSTEM">

  <!-- PWA / Mobile web app meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OXO.ID POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=oxo5">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=oxo5"/>

  <title>OXO.ID POS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Prevent Flutter 3.24 CanvasKit BrowserImageDecoder from leaking unclosed WebCodecs VideoFrames in Chromium.
    if (typeof window !== 'undefined' && 'ImageDecoder' in window) {
      try {
        window.ImageDecoder = undefined;
      } catch (_) {}
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
