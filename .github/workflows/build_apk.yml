name: Build Android APK (NusaCommerce Mobile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  build-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK 17 (Standar Android Gradle terbaru)
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK versi 3.24+
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      # 4. Generate runner Android bawaan (memastikan Gradle & Android wrapper siap)
      - name: Initialize Android Platform Wrapper
        run: |
          flutter create . --platforms=android --org id.nusacommerce --project-name nusacommerce_mobile
          # Pastikan package attribute tidak ada di AndroidManifest untuk AGP 8
          sed -i 's/package="id.nusacommerce.mobile"//g' android/app/src/main/AndroidManifest.xml

      # 5. Ambil dependensi pubspec
      - name: Install Dependencies
        run: flutter pub get

      # 6. Kompilasi menjadi file APK Release siap install
      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      # 7. Simpan file APK sebagai Artifact agar bisa langsung didownload
      - name: Upload APK ke Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NusaCommerce-POS-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
